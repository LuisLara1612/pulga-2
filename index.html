<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulga 2: La Gran Plaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Familjen+Grotesk:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="app">
  <canvas id="game" aria-label="Cabeza vista desde arriba con la colonia de pulgas"></canvas>

  <!-- Modo Primera persona: vista 3D, tintes, minimapa, palanca y flechas de aviso -->
  <canvas id="fp" class="fp-el" aria-label="Cabeza vista en 3D desde los ojos de la pulga"></canvas>
  <div id="fpOculta" class="fp-el fp-tinte"></div>
  <div id="fpAgua" class="fp-el fp-tinte"></div>
  <div id="fpPica" class="fp-el fp-tinte"></div>
  <div id="fpFlechas" class="fp-el" aria-hidden="true"><i hidden></i><i hidden></i><i hidden></i><i hidden></i><i hidden></i></div>
  <canvas id="fpMapa" class="fp-el" width="110" height="110" aria-hidden="true"></canvas>
  <div id="fpJoy" class="fp-el" hidden aria-hidden="true"><i></i></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-who"><b id="hudWho"></b><span id="hudPlace"></span></div>
      <div class="hud-btns"><button id="btnCasa" hidden>Casa</button><button id="btnPause" aria-label="Pausa">II</button></div>
    </div>
    <div class="meters">
      <div class="meter"><label>Sangre</label><div class="track"><i id="barBlood"></i></div></div>
      <div class="meter"><label id="itchLabel">Comezón</label><div class="track itch"><i id="barItch"></i><u style="left:40%"></u><u style="left:75%"></u></div></div>
    </div>
    <div id="enWrap" hidden><div class="meter"><label id="enLabel">Energía</label><div class="track en"><i id="barEn"></i></div></div></div>
    <div id="patWrap" hidden><div class="meter"><label>Paciencia de mamá</label><div class="track pat"><i id="barPat"></i></div></div></div>
    <div id="colony"><span id="colTxt"></span><span id="hidChip"></span></div>
    <div id="efChip" hidden></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint" hidden></div>
  <button id="btnEgg" class="act" hidden>Huevo<small>35 de sangre</small></button>
  <button id="btnJump" class="act" hidden>Saltar<small>Ve a la zona</small></button>
  <button id="btnHab" class="act" hidden aria-expanded="false" aria-controls="habMenu">Habilidad<small>1 · 2 · 3</small></button>
  <div id="habMenu" hidden></div>

  <section id="sTitle" class="screen">
    <div>
      <h1 class="logo">Pulga<em>2</em></h1>
      <p class="tagline">La Gran Plaga. Una cabeza a la vez.</p>
    </div>
    <div class="title-actions">
      <p class="note" id="titleNote"></p>
      <button class="btn" id="btnStart">Casa</button>
      <button class="btn alt" id="btnFp">Primera persona</button>
      <button class="btn alt" id="btnClassic">Clásico</button>
      <div class="resets"><button class="btn alt" id="btnResetCasa" hidden>Borrar partida de Casa</button><button class="btn alt" id="btnReset" hidden>Borrar avance clásico</button></div>
    </div>
  </section>

  <section id="sMap" class="screen" hidden>
    <div class="wrap">
      <div class="bulletin">
        <div><div class="eyebrow">Boletín de la plaga</div><h2>Mapa de la ciudad</h2></div>
        <div class="tally">
          <div><b id="tInf">0/6</b><span>Infectados</span></div>
          <div><b id="tGot">0</b><span>Gotas</span></div>
        </div>
      </div>
      <div id="mapBox"></div>
      <div class="ups"><h3>Mejoras de la colonia</h3><div id="upList"></div></div>
      <div class="map-foot">
        <button class="btn alt" id="btnBackTitle">Volver al inicio</button>
        <button class="btn alt" id="btnMute">Sonido: sí</button>
      </div>
    </div>
  </section>

  <section id="sCasa" class="screen" hidden>
    <div class="wrap">
      <div class="bulletin">
        <div><div class="eyebrow" id="casaReloj">Día 1</div><h2>La casa</h2></div>
        <div class="tally">
          <div><b id="cInf">0/5</b><span>Infestados</span></div>
          <div><b id="cTot">1</b><span>Pulgas</span></div>
        </div>
      </div>
      <ul id="casaAvisos" class="avisos" aria-live="polite"></ul>
      <div id="casaPlano"></div>
      <div id="casaFichas" class="fichas"></div>
      <div class="map-foot">
        <button class="btn alt" id="btnCasaPausa">Pausa</button>
        <button class="btn alt" id="btnCasaSalir">Salir al inicio</button>
      </div>
    </div>
  </section>

  <div id="sheet" class="sheet-back" hidden><div class="sheet" id="sheetBody"></div></div>
</div>

<script src="js/casa-sim.js"></script>
<script src="js/juego.js"></script>
<script src="js/casa.js"></script>
<script src="js/primera-persona.js"></script>
</body>
</html>
