<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulga 2: La Gran Plaga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Familjen+Grotesk:wght@400;600;700&display=swap">
<style>
/* Layout: a one-screen arcade view of a scalp seen from above; menus read like an outbreak bulletin stuck over the game. */
:root{
  color-scheme:dark;
  --costra:#2a0e14; --tinta:#160709; --sangre:#e0213f; --sangre-osc:#8d1229;
  --piel:#efbe97; --comezon:#ffc933; --espuma:#c6f1ef; --peine:#25c2b1; --papel:#f8e8d8; --papel-2:#c9a999;
  --display:"Chango","Arial Black",Impact,sans-serif;
  --body:"Familjen Grotesk","Trebuchet MS",system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--tinta)}
body{color:var(--papel);font-family:var(--body);font-size:16px;line-height:1.4}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:var(--tinta);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.node:focus-visible{outline:3px solid var(--comezon);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.02}
p{margin:0}

.btn{min-height:50px;padding:12px 20px;border-radius:14px 14px 22px 14px;background:var(--sangre);color:#fff;font-family:var(--display);font-size:18px;box-shadow:0 5px 0 var(--sangre-osc);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sangre-osc)}
.btn.alt{background:transparent;color:var(--papel);box-shadow:inset 0 0 0 2px var(--papel-2);font-family:var(--body);font-weight:700;font-size:16px}
.btn.alt:active{transform:translateY(1px)}

.screen{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}

/* Title */
#sTitle{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;touch-action:none;background:linear-gradient(180deg,rgba(22,7,9,.82) 0,rgba(22,7,9,0) 34%,rgba(22,7,9,0) 66%,rgba(22,7,9,.92) 100%)}
.logo{font-family:var(--display);font-size:clamp(68px,23vw,132px);line-height:.86;color:var(--papel);letter-spacing:-.01em}
.logo em{font-style:normal;color:var(--sangre);-webkit-text-stroke:2px var(--papel);padding-left:.06em}
.tagline{font-weight:700;font-size:17px;color:var(--comezon);margin-top:8px}
.title-actions{display:grid;gap:10px;max-width:420px}
.title-actions .note{font-size:14px;color:var(--papel);text-align:center;min-height:20px}

/* Map */
#sMap{background:var(--costra)}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.bulletin{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--papel-2)}
.bulletin h2{font-size:clamp(30px,9vw,42px)}
.tally{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.tally b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--comezon)}
.tally span{font-size:12px;color:var(--papel-2)}
#mapBox{background:#3a181e;border-radius:6px 26px 6px 26px;overflow:hidden}
#mapBox svg{display:block;width:100%;height:auto;max-height:62vh}
.node{cursor:pointer;outline:none}
.node text{font-family:var(--body);fill:var(--papel);text-anchor:middle}
.node .pl{font-weight:700;font-size:14px}
.node .wh{font-size:11.5px;fill:var(--papel-2)}
.node.locked{cursor:not-allowed;opacity:.75}
.node.open .ping{animation:ping 1.4s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.ups h3{font-size:22px;margin-bottom:10px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid rgba(248,232,216,.18)}
.up b{font-size:16px}
.up p{font-size:14px;color:var(--papel-2);grid-column:1}
.up button{grid-row:1/span 2;grid-column:2;min-height:44px;min-width:92px;padding:6px 12px;border-radius:10px;background:var(--comezon);color:var(--tinta);font-weight:700;font-variant-numeric:tabular-nums}
.up button[disabled]{background:rgba(248,232,216,.12);color:var(--papel-2);cursor:default}
.map-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px}

/* Sheets */
.sheet-back{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,7,9,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow-y:auto;touch-action:pan-y}
.sheet{width:100%;max-width:460px;background:var(--papel);color:var(--tinta);border-radius:8px 28px 8px 28px;padding:22px;display:grid;gap:12px;margin-block:auto}
.sheet .eyebrow{color:var(--sangre-osc)}
.sheet h2{font-size:32px}
.sheet p{font-size:16px}
.sheet .btn.alt{color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tinta);color:var(--papel)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--sangre-osc)}
.stats span{font-size:12.5px}
.actions{display:grid;gap:10px}
.goal{font-weight:700}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:3;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:grid;gap:6px;pointer-events:none;background:linear-gradient(180deg,rgba(22,7,9,.88) 70%,rgba(22,7,9,0))}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud-who{min-width:0;display:flex;flex-direction:column}
.hud-who b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1}
.hud-who span{font-size:13px;color:var(--papel-2)}
#btnPause{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:12px;background:rgba(248,232,216,.14);font-weight:700;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.meter label{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:12px;border-radius:6px;background:rgba(248,232,216,.16);overflow:hidden;margin-top:2px}
.track i{position:absolute;inset:0;transform-origin:left;background:var(--sangre);transform:scaleX(.5)}
.track.itch i{background:var(--comezon)}
.track.pat i{background:var(--peine)}
.track u{position:absolute;top:0;bottom:0;width:2px;background:var(--tinta)}
#colony{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
#hidChip{color:var(--peine)}
#patWrap{display:grid;gap:0}

#toast{position:absolute;z-index:4;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;padding:8px 14px;border-radius:10px 16px 10px 16px;background:var(--papel);color:var(--tinta);font-weight:700;font-size:15px;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}
#toast.show{opacity:1}
#toast.danger{background:var(--sangre);color:#fff}
#hint{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:center;bottom:calc(92px + env(safe-area-inset-bottom,0px));font-weight:700;font-size:15px;color:var(--papel);text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none}

.act{position:absolute;z-index:3;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:68px;min-width:124px;padding:6px 18px;font-family:var(--display);font-size:20px;line-height:1.05;touch-action:none}
.act small{display:block;font-family:var(--body);font-weight:700;font-size:12.5px}
#btnEgg{left:max(16px,env(safe-area-inset-left,0px));background:var(--papel);color:var(--tinta);border-radius:50% 50% 46% 46%/62% 62% 38% 38%;box-shadow:0 5px 0 var(--papel-2)}
#btnEgg[aria-disabled="true"]{opacity:.45}
#btnJump{right:max(16px,env(safe-area-inset-right,0px));background:var(--comezon);color:var(--tinta);border-radius:16px 16px 26px 16px;box-shadow:0 5px 0 #a87f07}
#btnJump[aria-disabled="true"]{background:rgba(248,232,216,.2);color:var(--papel);box-shadow:none}
#btnJump.ready{animation:bump .5s infinite alternate}
@keyframes bump{to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.node.open .ping,#btnJump.ready{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="game" aria-label="Cabeza vista desde arriba con la colonia de pulgas"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-who"><b id="hudWho"></b><span id="hudPlace"></span></div>
      <button id="btnPause" aria-label="Pausa">II</button>
    </div>
    <div class="meters">
      <div class="meter"><label>Sangre</label><div class="track"><i id="barBlood"></i></div></div>
      <div class="meter"><label id="itchLabel">Comezón</label><div class="track itch"><i id="barItch"></i><u style="left:40%"></u><u style="left:75%"></u></div></div>
    </div>
    <div id="patWrap" hidden><div class="meter"><label>Paciencia de mamá</label><div class="track pat"><i id="barPat"></i></div></div></div>
    <div id="colony"><span id="colTxt"></span><span id="hidChip"></span></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint" hidden></div>
  <button id="btnEgg" class="act" hidden>Huevo<small>35 de sangre</small></button>
  <button id="btnJump" class="act" hidden>Saltar<small>Ve a la zona</small></button>

  <section id="sTitle" class="screen">
    <div>
      <h1 class="logo">Pulga<em>2</em></h1>
      <p class="tagline">La Gran Plaga. Una cabeza a la vez.</p>
    </div>
    <div class="title-actions">
      <p class="note" id="titleNote"></p>
      <button class="btn" id="btnStart">Empezar la plaga</button>
      <button class="btn alt" id="btnReset" hidden>Borrar avance</button>
    </div>
  </section>

  <section id="sMap" class="screen" hidden>
    <div class="wrap">
      <div class="bulletin">
        <div><div class="eyebrow">Boletín de la plaga</div><h2>Mapa de la ciudad</h2></div>
        <div class="tally">
          <div><b id="tInf">0/6</b><span>Infectados</span></div>
          <div><b id="tGot">0</b><span>Gotas</span></div>
        </div>
      </div>
      <div id="mapBox"></div>
      <div class="ups"><h3>Mejoras de la colonia</h3><div id="upList"></div></div>
      <div class="map-foot">
        <button class="btn alt" id="btnBackTitle">Volver al inicio</button>
        <button class="btn alt" id="btnMute">Sonido: sí</button>
      </div>
    </div>
  </section>

  <div id="sheet" class="sheet-back" hidden><div class="sheet" id="sheetBody"></div></div>
</div>

<script>
/* ---------- Utilidades ---------- */
const R=100, TAU=Math.PI*2, SPEED=56, NPC_SPEED=38, EGG_COST=35, HATCH=9;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
const rand=(a,b)=>a+Math.random()*(b-a);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}

/* ---------- Niveles ---------- */
const LEVELS=[
 {id:'nino',place:'Escuela',who:'Niño de primaria',goal:3,reward:22,skin:'#ecb98f',hair:'#3f2415',strands:2300,len:[6,11],tufts:9,tuftR:[13,18],shirt:'#2f6f9f',
  threats:{nails:5,comb:3},first:16,every:11,nailWarn:1.35,nailAim:26,combSpeed:36,zone:.8,window:16,
  blurb:'Aquí aprendes a picar, poner huevos y esconderte. Hay mucho pelo y muchos compañeros cerca.',
  watch:['Uñas','Peine de la revisión'],contact:'¡Un compañero se acercó en el recreo!'},
 {id:'teen',place:'Autobús',who:'Adolescente',goal:4,reward:26,skin:'#d9a077',hair:'#15110f',strands:2500,len:[7,12],tufts:7,tuftR:[12,17],gels:5,shirt:'#59407f',
  threats:{nails:4,comb:2,dryer:3,shampoo:2},first:9,every:9.5,nailWarn:1.15,nailAim:22,combSpeed:42,zone:.7,window:14,
  blurb:'Trae mucho gel. Las zonas brillantes te frenan, así que cruza por fuera si te persiguen.',
  watch:['Uñas','Peine','Secadora','Champú','Gel pegajoso'],contact:'¡Alguien se recargó en el asiento de junto!'},
 {id:'calvo',place:'Oficina',who:'Señor casi calvo',goal:4,reward:30,skin:'#f0c49f',hair:'#5e5650',strands:1100,len:[4,7],tufts:5,tuftR:[9,12],bald:true,shirt:'#3d4a58',
  threats:{nails:6,shampoo:2,dryer:2},first:8,every:8.5,nailWarn:1.05,nailAim:12,combSpeed:40,zone:.42,window:11,
  blurb:'Casi no hay dónde esconderse y las uñas te ven venir. La zona de salto también es más chica.',
  watch:['Uñas certeras','Champú','Secadora'],contact:'¡Un compañero se asoma a su pantalla!'},
 {id:'abuela',place:'Concierto',who:'Abuela con permanente',goal:5,reward:34,skin:'#f2cdb0',hair:'#cfc4dc',strands:2000,len:[5,9],tufts:5,tuftR:[11,14],curls:true,clouds:2,shirt:'#7c3a55',
  threats:{nails:3,dryer:3,shampoo:2,comb:2},first:9,every:9,nailWarn:1.1,nailAim:20,combSpeed:40,zone:.65,window:14,
  blurb:'Los rizos son paredes y la nube de laca te deja pegada. Busca los pasillos entre los rizos.',
  watch:['Rizos','Nube de laca','Secadora','Uñas','Champú','Peine'],contact:'¡Su comadre se acercó a cantar!'},
 {id:'perro',place:'Parque',who:'Perro de la familia',goal:6,reward:55,skin:'#d9a55f',hair:'#9c6426',strands:2700,len:[8,13],tufts:13,tuftR:[12,17],dog:true,collar:true,bloodMul:1.7,shirt:'#3f6b34',secret:true,
  threats:{nails:5,shampoo:3},first:8,every:8,nailWarn:1.05,nailAim:18,paw:true,combSpeed:40,zone:.7,window:15,
  blurb:'Nivel secreto. La sangre rinde casi el doble, pero la pata es enorme y el collar envenena.',
  watch:['Pata','Baño','Collar antipulgas'],contact:'¡El niño viene a abrazarlo!'},
 {id:'mama',place:'Casa',who:'La mamá',boss:true,goal:0,patience:85,reward:60,skin:'#ecb98f',hair:'#6b2c1a',strands:2400,len:[6,11],tufts:8,tuftR:[12,16],shirt:'#a8483a',
  threats:{comb:4,shampoo:3,nails:3,dryer:1},first:6,every:6.5,nailWarn:1,nailAim:16,combSpeed:46,zone:.6,window:12,lens:true,
  blurb:'Jefa final: sienta al niño y lo revisa pelo por pelo. Aguanta hasta que se le acabe la paciencia y salta cuando lo abrace.',
  watch:['Lupa y pinzas','Peine','Champú','Uñas','Secadora'],contact:'¡Se rindió y lo abrazó! Salta a su cabeza.'}
];
const ORDER=['nino','teen','calvo','abuela','mama'];
const LV=id=>LEVELS.find(l=>l.id===id);
const UPS=[
 {id:'salto',name:'Salto largo',txt:'Zona de salto 50 % más ancha y 5 segundos más para llegar.',cost:30},
 {id:'anes',name:'Picada anestésica',txt:'Cada picada causa casi la mitad de comezón.',cost:40},
 {id:'capa',name:'Caparazón duro',txt:'Cada pulga resiste un golpe de uñas.',cost:35},
 {id:'huevos',name:'Huevos resistentes',txt:'Tus huevos sobreviven al champú.',cost:30}
];

/* ---------- Guardado ---------- */
const SAVE_KEY='pulga2-avance';
let save={done:{},gotas:0,ups:{},dog:false,mute:false};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.done)save=Object.assign(save,s)}catch(e){}}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
loadSave();
const hasProgress=()=>Object.keys(save.done).length>0||save.gotas>0;

/* ---------- Sonido ---------- */
let ac=null;
function audioOn(){if(ac||save.mute)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d=.1,type='square',v=.05,to=0){
  if(!ac||save.mute)return;
  try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const SFX={egg:()=>beep(520,.12,'triangle',.08,240),hatch:()=>beep(420,.14,'triangle',.08,900),die:()=>beep(300,.28,'sawtooth',.07,50),warn:()=>{beep(880,.1);setTimeout(()=>beep(660,.12),120)},
  hit:()=>beep(110,.2,'square',.1,50),jump:()=>beep(240,.5,'triangle',.1,1200),win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.09),i*110))},sip:()=>beep(170,.05,'sine',.035,120)};

/* ---------- Mundo ---------- */
let G=null, mode='title';
const cv=$('game'), ctx=cv.getContext('2d');
let W=360,H=640,DPR=1,S=1.6,CX=180,CY=320;
const layers={scene:null,head:null,over:null};
function hash(s){let h=7;for(const c of s)h=h*31+c.charCodeAt(0)|0;return h}

function genWorld(L){
  const r=seeded(hash(L.id)), w={tufts:[],gels:[],curls:[],clouds:[]};
  if(L.curls){
    [[38,7,[2]],[72,12,[3,9]]].forEach(([rad,n,gaps])=>{
      const off=r()*TAU;
      for(let i=0;i<n;i++){if(gaps.includes(i))continue;const a=off+i/n*TAU;w.curls.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,r:rad<50?8.5:9.5,seed:r()*TAU})}
    });
  }
  const free=(x,y,rr,list,pad)=>list.every(o=>hyp(o.x-x,o.y-y)>o.r+rr+pad);
  let tries=0;
  while(w.tufts.length<L.tufts&&tries++<900){
    const a=r()*TAU, d=Math.sqrt(r())*88, x=Math.cos(a)*d, y=Math.sin(a)*d, rr=lerp(L.tuftR[0],L.tuftR[1],r());
    if(d+rr>97) continue;
    if(L.bald&&!(y>-20&&Math.abs(x)>38||y>62)) continue;
    if(L.collar&&y>38&&d>62) continue;
    if(!free(x,y,rr,w.tufts,-1)||!free(x,y,rr,w.curls,1)) continue;
    w.tufts.push({x,y,r:rr,seed:r()*9999|0});
  }
  tries=0;
  while(w.gels.length<(L.gels||0)&&tries++<400){
    const a=r()*TAU,d=Math.sqrt(r())*78,x=Math.cos(a)*d,y=Math.sin(a)*d,rr=lerp(14,22,r());
    if(free(x,y,rr,w.tufts,-3)&&free(x,y,rr,w.gels,2)) w.gels.push({x,y,r:rr});
  }
  for(let i=0;i<(L.clouds||0);i++) w.clouds.push({x:0,y:0,r:25,a:r()*TAU,b:r()*TAU,sp:.22+r()*.14});
  return w;
}
function hairDensity(L,x,y){
  if(L.bald){const d=hyp(x,y);return (y>-20&&Math.abs(x)>36)||d>80&&y>-30?1:.04}
  return 1;
}

/* ---------- Capas pintadas una vez ---------- */
function mk(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;return c}
function drawScene(c,L){
  const Wp=cv.width,Hp=cv.height,u=Math.max(Wp,Hp)/20;
  const pal={nino:['#2e4b3b','#284335'],teen:['#2a3b57','#24334c'],calvo:['#3b4150','#343a48'],abuela:['#201532','#2a1c40'],perro:['#335c2b','#2c5126'],mama:['#5a382c','#4d2f25']}[L.id]||['#333','#2c2c2c'];
  c.fillStyle=pal[0];c.fillRect(0,0,Wp,Hp);c.fillStyle=pal[1];
  if(L.id==='nino'||L.id==='mama'){for(let y=0;y<Hp/u+1;y++)for(let x=0;x<Wp/u+1;x++)if((x+y)%2)c.fillRect(x*u,y*u,u,u)}
  else if(L.id==='teen'){for(let x=0;x<Wp;x+=u*1.1)c.fillRect(x,0,u*.45,Hp)}
  else if(L.id==='calvo'){for(let y=0;y<Hp;y+=u*.5)for(let x=(y/(u*.5)%2)*u*.25;x<Wp;x+=u*.5){c.beginPath();c.arc(x,y,u*.06,0,TAU);c.fill()}}
  else if(L.id==='abuela'){c.globalAlpha=.5;['#ff5f9e','#59c9ff','#ffc933'].forEach((col,i)=>{c.fillStyle=col;c.globalAlpha=.1;c.beginPath();const x=Wp*(.2+i*.3);c.moveTo(x,-10);c.lineTo(x-u*3,Hp);c.lineTo(x+u*3,Hp);c.fill()});c.globalAlpha=1}
  else if(L.id==='perro'){const r=seeded(4);c.strokeStyle=pal[1];c.lineWidth=2*DPR;for(let i=0;i<240;i++){const x=r()*Wp,y=r()*Hp;c.beginPath();c.moveTo(x,y);c.lineTo(x+r()*6*DPR-3*DPR,y-8*DPR);c.stroke()}}
  const g=c.createRadialGradient(Wp/2,Hp/2,Hp*.2,Wp/2,Hp/2,Hp*.75);g.addColorStop(0,'rgba(10,3,5,0)');g.addColorStop(1,'rgba(10,3,5,.6)');c.fillStyle=g;c.fillRect(0,0,Wp,Hp);
}
function worldXf(c){c.setTransform(DPR*S,0,0,DPR*S,DPR*CX,DPR*CY)}
function hairStrokes(c,L,r,x,y,len,col,w){
  const ang=Math.atan2(y-8,x)+(r()-.5)*.9;
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);
  c.quadraticCurveTo(x+Math.cos(ang+.4)*len*.6,y+Math.sin(ang+.4)*len*.6,x+Math.cos(ang)*len,y+Math.sin(ang)*len);c.stroke();
}
function buildLayers(){
  if(!G) return;
  const L=G.L,w=G.w;
  layers.scene=mk();const sc=layers.scene.getContext('2d');drawScene(sc,L);
  /* cabeza */
  layers.head=mk();const c=layers.head.getContext('2d');worldXf(c);
  c.fillStyle=L.shirt;c.beginPath();c.ellipse(0,78,R*1.5,R*.8,0,0,TAU);c.fill();
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.arc(0,6,R+5,0,TAU);c.fill();
  if(L.dog){c.fillStyle=L.hair;[-1,1].forEach(s=>{c.beginPath();c.ellipse(s*96,-8,16,34,s*.25,0,TAU);c.fill()});c.fillStyle=L.skin;c.beginPath();c.ellipse(0,-100,22,20,0,0,TAU);c.fill();c.fillStyle='#21130f';c.beginPath();c.ellipse(0,-111,8,6,0,0,TAU);c.fill()}
  else{c.fillStyle=L.skin;[-1,1].forEach(s=>{c.beginPath();c.ellipse(s*100,-4,10,16,0,0,TAU);c.fill()});c.beginPath();c.ellipse(0,-101,10,9,0,0,TAU);c.fill()}
  const g=c.createRadialGradient(-20,-26,10,0,0,R);g.addColorStop(0,L.skin);g.addColorStop(1,shade(L.skin,-.14));
  c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,TAU);c.fill();
  c.save();c.beginPath();c.arc(0,0,R,0,TAU);c.clip();
  const r=seeded(hash(L.id)+1);c.lineCap='round';
  for(let i=0;i<L.strands;i++){
    const a=r()*TAU,d=Math.sqrt(r())*R,x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(r()>hairDensity(L,x,y)) continue;
    c.globalAlpha=.32+r()*.3;
    hairStrokes(c,L,r,x,y,lerp(L.len[0],L.len[1],r()),L.hair,.45+r()*.35);
  }
  c.globalAlpha=1;
  if(L.bald){const sh=c.createRadialGradient(-22,-36,1,-22,-36,36);sh.addColorStop(0,'rgba(255,255,255,.65)');sh.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sh;c.fillRect(-70,-80,100,90)}
  w.gels.forEach(z=>{const gg=c.createRadialGradient(z.x-z.r*.3,z.y-z.r*.3,1,z.x,z.y,z.r);gg.addColorStop(0,'rgba(190,240,255,.65)');gg.addColorStop(.7,'rgba(90,170,220,.38)');gg.addColorStop(1,'rgba(90,170,220,.12)');c.fillStyle=gg;c.beginPath();c.arc(z.x,z.y,z.r,0,TAU);c.fill();c.strokeStyle='rgba(200,240,255,.5)';c.lineWidth=.5;c.stroke()});
  if(L.collar){c.strokeStyle='#2a6d4e';c.lineWidth=17;c.beginPath();c.arc(0,0,R-7,.18*Math.PI,.82*Math.PI);c.stroke();c.strokeStyle='#8cf0a8';c.lineWidth=1.2;c.setLineDash([2,5]);c.beginPath();c.arc(0,0,R-7,.18*Math.PI,.82*Math.PI);c.stroke();c.setLineDash([])}
  c.restore();
  /* mechones y rizos encima de las pulgas */
  layers.over=mk();const o=layers.over.getContext('2d');worldXf(o);o.lineCap='round';
  w.tufts.forEach(t=>{
    const q=seeded(t.seed);
    o.fillStyle=hexA(L.hair,.5);o.beginPath();o.arc(t.x,t.y,t.r,0,TAU);o.fill();
    for(let i=0;i<Math.round(t.r*8);i++){
      const a=q()*TAU,d=Math.sqrt(q())*t.r*.95,x=t.x+Math.cos(a)*d,y=t.y+Math.sin(a)*d;
      const ang=a+1.2+q()*.6,len=4+q()*5;
      o.strokeStyle=q()<.2?shade(L.hair,.3):L.hair;o.lineWidth=.8+q()*.5;o.globalAlpha=.75+q()*.25;
      o.beginPath();o.moveTo(x,y);o.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);o.stroke();
    }
    o.globalAlpha=1;
  });
  w.curls.forEach(k=>{
    o.fillStyle=shade(L.hair,-.22);o.beginPath();o.arc(k.x,k.y,k.r,0,TAU);o.fill();
    o.strokeStyle='#efe9f6';o.lineWidth=1.25;o.beginPath();
    for(let t=0;t<16;t+=.3){const rr=k.r*(t/16),a=k.seed+t;const x=k.x+Math.cos(a)*rr,y=k.y+Math.sin(a)*rr;t?o.lineTo(x,y):o.moveTo(x,y)}
    o.stroke();
  });
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(v+(p>0?255-v:v)*p),0,255);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

/* ---------- Tamaño ---------- */
function layout(){
  const b=$('app').getBoundingClientRect();
  W=Math.max(1,b.width);H=Math.max(1,b.height);DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  let top,bottom;
  if(mode==='title'){top=H*.28;bottom=H*.24}
  else{top=($('hud').hidden?150:$('hud').offsetHeight)+6;bottom=92}
  const avail=Math.max(120,H-top-bottom);
  S=Math.min((W-8)/(2*(R+13)),avail/(2*(R+10)));
  CX=W/2;CY=top+avail/2;
  buildLayers();
  placeToast(top);
}
function placeToast(top){$('toast').style.top=(top+2)+'px'}
new ResizeObserver(layout).observe($('app'));

/* ---------- Partida ---------- */
function newGame(L,attract){
  const g={L,w:genWorld(L),attract:!!attract,t:0,blood:60,itch:0,fleas:[],eggs:[],marks:[],threats:[],parts:[],scratches:[],
    player:null,spawnT:L.first,queue:[],contact:null,contactWait:0,goalDone:false,gotas:0,lost:0,shake:0,patience:L.patience||0,starve:0,
    stillT:0,biting:false,wind:{x:0,y:0},jump:null,overT:0,tut:L.id==='nino'&&!save.done.nino?0:-1,moved:0,lens:L.lens?{x:0,y:-60,prog:0}:null,sipT:0,everHid:false};
  return g;
}
function makeFlea(x,y,ai){return{x,y,a:rand(0,TAU),ai,alive:true,step:rand(0,9),shield:!!save.ups.capa,hidden:false,biting:false,tx:x,ty:y,wait:rand(.5,2),boost:0}}
function startAttract(){
  mode='title';G=newGame(LEVELS[0],true);
  for(let i=0;i<8;i++){const a=rand(0,TAU),d=rand(10,85);G.fleas.push(makeFlea(Math.cos(a)*d,Math.sin(a)*d,true))}
  showOnly('sTitle');layout();
}
function startLevel(L){
  mode='play';G=newGame(L);
  const p=makeFlea(0,L.curls?0:18,false);G.fleas.push(p);G.player=p;
  showOnly(null);
  $('hud').hidden=false;$('btnEgg').hidden=false;$('btnJump').hidden=true;$('hint').hidden=true;

  $('patWrap').hidden=!L.boss;
  layout();
  keys.clear();joy=null;
  toast(L.boss?'Aguanta hasta que mamá se rinda':'Haz crecer tu colonia a '+L.goal+' pulgas',false,2.6);
  audioOn();
}
function adults(){return G.fleas.filter(f=>f.alive).length}

/* ---------- Entrada ---------- */
let joy=null;const keys=new Set();
function getMove(){
  let x=0,y=0;
  if(keys.has('arrowleft')||keys.has('a'))x--; if(keys.has('arrowright')||keys.has('d'))x++;
  if(keys.has('arrowup')||keys.has('w'))y--; if(keys.has('arrowdown')||keys.has('s'))y++;
  if(x||y){const m=hyp(x,y);return{x:x/m,y:y/m}}
  if(joy){let dx=(joy.x-joy.sx)/30,dy=(joy.y-joy.sy)/30,m=hyp(dx,dy);if(m<.14)return{x:0,y:0};if(m>1){dx/=m;dy/=m}return{x:dx,y:dy}}
  return{x:0,y:0};
}
cv.addEventListener('pointerdown',e=>{audioOn();if(mode!=='play'||joy)return;joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;
  const dx=joy.x-joy.sx,dy=joy.y-joy.sy,m=hyp(dx,dy);if(m>50){joy.sx+=dx/m*(m-50);joy.sy+=dy/m*(m-50)}}});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(mode==='play'){
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
    if(k==='e')tryEgg(); else if(k===' ')tryJump(); else if(k==='p'||k==='escape')pause(); else keys.add(k);
    audioOn();
  }
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();joy=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
function press(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioOn();fn()});el.addEventListener('click',e=>{if(e.detail===0)fn()})}
press($('btnEgg'),()=>tryEgg());press($('btnJump'),()=>tryJump());press($('btnPause'),()=>pause());

function tryEgg(){
  if(mode!=='play'||!G.player||G.jump)return;
  if(G.blood<EGG_COST){toast('Te falta sangre: quédate quieta para picar',false,1.5);return}
  if(G.eggs.length+adults()>=14){toast('La colonia ya no cabe aquí',false,1.3);return}
  const p=G.player;G.blood-=EGG_COST;G.eggs.push({x:p.x,y:p.y,t:0,seed:rand(0,TAU)});SFX.egg();
  if(G.tut===2)G.tut=3;
}
function inZone(p){
  const c=G.contact;if(!c||!c.open||!p)return false;
  return hyp(p.x,p.y)>70&&Math.abs(angDiff(Math.atan2(p.y,p.x),c.a))<c.w;
}
function tryJump(){
  if(mode!=='play'||G.jump||!G.contact||!inZone(G.player))return;
  const p=G.player,c=G.contact;
  G.jump={t:0,x0:p.x,y0:p.y,x1:Math.cos(c.a)*R*1.65,y1:Math.sin(c.a)*R*1.65};
  G.threats=[];SFX.jump();$('btnJump').hidden=true;$('btnEgg').hidden=true;
}

/* ---------- Toasts ---------- */
let toastT=0;
function toast(msg,danger,dur=1.8){const t=$('toast');t.textContent=msg;t.classList.add('show');t.classList.toggle('danger',!!danger);toastT=dur}

/* ---------- Pulgas ---------- */
function moveFlea(f,vx,vy,dt){
  const w=G.w;
  f.hidden=w.tufts.some(t=>hyp(t.x-f.x,t.y-f.y)<t.r);
  const wf=f.hidden?.2:1;
  f.x+=vx*dt+G.wind.x*wf*dt;f.y+=vy*dt+G.wind.y*wf*dt;
  const onWind=hyp(G.wind.x,G.wind.y)>0;
  w.curls.forEach(k=>{const dx=f.x-k.x,dy=f.y-k.y,d=hyp(dx,dy),m=k.r+3;if(d<m&&d>0){f.x=k.x+dx/d*m;f.y=k.y+dy/d*m}});
  const d=hyp(f.x,f.y);
  if(d>R-2){
    if(onWind&&d>R+1){kill(f,'La secadora la tiró de la cabeza');return}
    if(!onWind){f.x*=(R-2)/d;f.y*=(R-2)/d}
  }
  if(vx||vy){f.a=Math.atan2(vy,vx);f.step+=dt*16}
}
function hitByStrip(f,th){
  const dx=f.x-th.x,dy=f.y-th.y,c=Math.cos(-th.a),s=Math.sin(-th.a),u=dx*c-dy*s,v=dx*s+dy*c;
  return Math.abs(u)<th.len/2+3&&Math.abs(v)<th.w/2+1;
}
function splat(x,y,col='#b5122e',n=10){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(8,38);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rand(.3,.7),r:rand(.8,2.2),col})}}
function kill(f,why){
  if(!f.alive)return;
  f.alive=false;splat(f.x,f.y);G.lost++;SFX.die();
  if(G.attract)return;
  if(f===G.player){
    let best=null,bd=1e9;G.fleas.forEach(o=>{if(o.alive&&o!==f){const d=hyp(o.x-f.x,o.y-f.y);if(d<bd){bd=d;best=o}}});
    G.player=best;
    if(best){best.ai=false;G.blood=Math.max(G.blood,40);G.starve=0;toast((why?why+'. ':'')+'Ahora controlas a otra pulga',true,2.2)}
    else if(G.eggs.length){toast('Sin adultas: los huevos están por nacer',true,2.2)}
    else{toast(why||'Eliminaron tu colonia',true,2);G.overT=1.2}
  }
}
function npcTarget(f,dt){
  /* peligro primero */
  const sh=G.threats.find(t=>t.k==='shampoo');
  if(sh){let b=sh.spots[0],bd=1e9;sh.spots.forEach(s=>{const d=hyp(s.x-f.x,s.y-f.y);if(d<bd){bd=d;b=s}});f.tx=b.x;f.ty=b.y;return true}
  const cb=G.threats.find(t=>t.k==='comb');
  if(cb){if(cb.axis==='y')f.tx=cb.g;else f.ty=cb.g;if(cb.axis==='y')f.ty=f.y;else f.tx=f.x;return true}
  const dr=G.threats.find(t=>t.k==='dryer');
  const nearestTuft=()=>{let b=null,bd=1e9;G.w.tufts.forEach(s=>{const d=hyp(s.x-f.x,s.y-f.y);if(d<bd){bd=d;b=s}});return b};
  if(dr){const b=nearestTuft();if(b){f.tx=b.x;f.ty=b.y}else{f.tx=f.x*.3;f.ty=f.y*.3}return true}
  const nl=G.threats.find(t=>t.k==='nails'&&t.stage===0&&hitByStrip(f,t));
  if(nl&&!f.hidden){const b=nearestTuft();if(b){f.tx=b.x;f.ty=b.y;return true}}
  return false;
}
function updateNpc(f,dt){
  const danger=!G.attract&&npcTarget(f,dt);
  const dx=f.tx-f.x,dy=f.ty-f.y,d=hyp(dx,dy);
  f.biting=false;
  if(!danger&&d<3){
    f.wait-=dt;f.biting=f.wait>0;
    if(f.biting&&!G.attract){G.itch+=.5*(save.ups.anes?.55:1)*dt;G.blood=Math.min(100,G.blood+.5*dt)}
    if(f.wait<=0){
      const tf=G.w.tufts;let x,y;
      if(tf.length&&Math.random()<.6){const t=tf[Math.random()*tf.length|0];x=t.x+rand(-.5,.5)*t.r;y=t.y+rand(-.5,.5)*t.r}
      else{const a=rand(0,TAU),r=rand(5,90);x=Math.cos(a)*r;y=Math.sin(a)*r}
      f.tx=x;f.ty=y;f.wait=rand(2,5);
    }
    moveFlea(f,0,0,dt);
  }else if(d>.5){
    let sp=NPC_SPEED*slowAt(f);
    moveFlea(f,dx/d*sp,dy/d*sp,dt);
  }else moveFlea(f,0,0,dt);
}
function slowAt(f){
  let m=1;
  if(G.w.gels.some(z=>hyp(z.x-f.x,z.y-f.y)<z.r))m*=.45;
  if(G.w.clouds.some(z=>hyp(z.x-f.x,z.y-f.y)<z.r))m*=.4;
  return m;
}

/* ---------- Amenazas ---------- */
function spawn(kind){
  const L=G.L,p=G.player||{x:0,y:0};
  if(kind==='nails'){
    const big=!!L.paw,mv=getMove(),aim=L.nailAim;
    const x=clamp(p.x+mv.x*18+rand(-aim,aim),-85,85),y=clamp(p.y+mv.y*18+rand(-aim,aim),-85,85);
    G.threats.push({k:'nails',x,y,a:rand(0,TAU),len:big?76:60,w:big?50:34,t:0,warn:L.nailWarn,stage:0,hitDone:false});
  }else if(kind==='comb'){
    const axis=Math.random()<.65?'y':'x',dir=Math.random()<.5?1:-1;
    G.threats.push({k:'comb',axis,dir,pos:-dir*128,g:rand(-55,55),gap:32,sp:L.combSpeed,t:0,warn:1.25});
    toast('¡Peine! Cruza por el hueco verde',true,1.8);SFX.warn();
  }else if(kind==='shampoo'){
    const spots=[];let tries=0;
    while(spots.length<3&&tries++<200){
      const a=rand(0,TAU),d=rand(15,72),x=Math.cos(a)*d,y=Math.sin(a)*d;
      if(spots.every(s=>hyp(s.x-x,s.y-y)>48)&&G.w.curls.every(k=>hyp(k.x-x,k.y-y)>k.r+15))spots.push({x,y,r:15});
    }
    if(!spots.length)spots.push({x:0,y:0,r:15});
    G.threats.push({k:'shampoo',t:0,spots,fill:4.4,hold:1.8,drain:1.3});
    toast('¡Champú! Sube a un lugar alto',true,2.4);SFX.warn();
  }else if(kind==='dryer'){
    const a=rand(0,TAU);
    G.threats.push({k:'dryer',a,t:0,warn:1,dur:5.5,force:L.bald?24:30,seed:rand(0,99)});
    toast('¡Secadora! Agárrate a un mechón',true,1.8);SFX.warn();
  }
}
function majorActive(){return G.threats.some(t=>t.k!=='nails')}
function updateThreats(dt){
  G.wind.x=G.wind.y=0;
  const all=[...G.fleas];
  G.threats=G.threats.filter(th=>{
    th.t+=dt;
    if(th.k==='nails'){
      if(th.stage===0&&th.t>=th.warn){
        th.stage=1;G.shake=REDUCED?0:7;SFX.hit();
        G.itch=Math.max(0,G.itch-9);
        all.forEach(f=>{if(f.alive&&!f.hidden&&hitByStrip(f,th)){
          if(f.shield){f.shield=false;splat(f.x,f.y,'#ffc933',8);toast('El caparazón aguantó el golpe',false,1.4)}
          else kill(f,G.L.paw?'La aplastó la pata':'La aplastaron las uñas');
        }});
        G.eggs=G.eggs.filter(e=>{const hid=G.w.tufts.some(t=>hyp(t.x-e.x,t.y-e.y)<t.r);if(!hid&&hitByStrip(e,th)){splat(e.x,e.y,'#f8e8d8',5);return false}return true});
        G.scratches.push({x:th.x,y:th.y,a:th.a,len:th.len,w:th.w,t:0});
      }
      return th.t<th.warn+.55;
    }
    if(th.k==='comb'){
      if(th.t<th.warn)return true;
      th.pos+=th.dir*th.sp*dt;
      all.forEach(f=>{if(!f.alive)return;const c=th.axis==='y'?f.y:f.x,q=th.axis==='y'?f.x:f.y;
        if(Math.abs(c-th.pos)<5&&Math.abs(q-th.g)>th.gap/2)kill(f,'La atrapó el peine')});
      if(Math.abs(th.pos)>130&&Math.sign(th.pos)===th.dir){G.itch=Math.max(0,G.itch-8);return false}
      return true;
    }
    if(th.k==='shampoo'){
      th.r=shampooR(th);
      if(th.t<th.fill+th.hold){
        const onSpot=o=>th.spots.some(s=>hyp(s.x-o.x,s.y-o.y)<s.r);
        all.forEach(f=>{if(f.alive&&hyp(f.x,f.y)>th.r&&!onSpot(f))kill(f,'Se la llevó el champú')});
        if(!save.ups.huevos)G.eggs=G.eggs.filter(e=>{if(hyp(e.x,e.y)>th.r&&!onSpot(e)){splat(e.x,e.y,'#c6f1ef',4);return false}return true});
      }
      if(th.t>th.fill+th.hold+th.drain){G.marks=[];G.itch=Math.max(0,G.itch-22);return false}
      return true;
    }
    if(th.k==='dryer'){
      if(th.t>th.warn){const ramp=clamp((th.t-th.warn)*2,0,1);G.wind.x=Math.cos(th.a)*th.force*ramp;G.wind.y=Math.sin(th.a)*th.force*ramp}
      return th.t<th.warn+th.dur;
    }
    return false;
  });
}
function shampooR(th){
  if(th.t<th.fill)return lerp(124,-4,th.t/th.fill);
  if(th.t<th.fill+th.hold)return -4;
  return lerp(-4,124,(th.t-th.fill-th.hold)/th.drain);
}
function pickThreat(){
  const tw=G.L.threats,bag=[];
  for(const k in tw){for(let i=0;i<tw[k];i++)bag.push(k)}
  return bag[Math.random()*bag.length|0];
}

/* ---------- Bucle ---------- */
function update(dt){
  G.t+=dt;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show')}
  G.parts=G.parts.filter(q=>{q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;return q.t<q.life});
  G.scratches=G.scratches.filter(s=>{s.t+=dt;return s.t<2});
  G.shake=Math.max(0,G.shake-dt*22);

  if(G.attract){G.fleas.forEach(f=>updateNpc(f,dt));G.fleas=G.fleas.filter(f=>f.alive);return}

  if(G.overT>0){G.overT-=dt;if(G.overT<=0)gameOver();return}
  if(G.jump){
    const j=G.jump;j.t+=dt/.85;const p=G.player;
    p.x=lerp(j.x0,j.x1,j.t);p.y=lerp(j.y0,j.y1,j.t);p.a=Math.atan2(j.y1-j.y0,j.x1-j.x0);p.step+=dt*30;
    if(j.t>=1)finishLevel();
    return;
  }

  const L=G.L,w=G.w;
  w.clouds.forEach(c=>{c.x=Math.cos(G.t*c.sp+c.a)*62;c.y=Math.sin(G.t*c.sp*1.3+c.b)*62});
  updateThreats(dt);

  /* jugadora */
  const p=G.player;let wasBiting=false;
  if(p&&p.alive){
    const mv=getMove(),m=hyp(mv.x,mv.y),slow=slowAt(p),sp=SPEED*slow;
    moveFlea(p,mv.x*sp,mv.y*sp,dt);
    if(!p.alive){/* cayó */}
    else{
      if(m>.1){G.stillT=0;G.moved+=m*dt}else G.stillT+=dt;
      p.biting=G.stillT>.22&&G.blood<100;
      if(p.biting){
        wasBiting=true;
        let mk=G.marks.find(k=>hyp(k.x-p.x,k.y-p.y)<8);
        if(!mk){mk={x:p.x,y:p.y,h:0,age:0};G.marks.push(mk)}
        mk.h=Math.min(5,mk.h+dt*.55);mk.age=0;
        const bloodRate=22*(L.bloodMul||1)*Math.max(.35,1-mk.h*.16)*(p.hidden?.65:1);
        const gain=bloodRate*dt;G.blood=Math.min(100,G.blood+gain);G.gotas+=gain/6;
        G.itch+=5.6*(1+mk.h*.55)*(save.ups.anes?.55:1)*dt;
        G.sipT-=dt;if(G.sipT<=0){SFX.sip();G.sipT=.42}
      }
    }
  }
  /* desgaste */
  G.blood-=1.4*dt;
  if(p&&p.alive&&L.collar&&p.y>0&&hyp(p.x,p.y)>R-17&&Math.abs(angDiff(Math.atan2(p.y,p.x),Math.PI/2))<.32*Math.PI){G.blood-=24*dt;if(!G.collarWarned){toast('¡El collar envenena! Sal de ahí',true,1.6);G.collarWarned=true}}
  if(p&&w.clouds.some(c=>hyp(c.x-p.x,c.y-p.y)<c.r))G.blood-=5*dt;
  G.blood=Math.max(0,G.blood);
  if(G.blood<=0&&G.player){G.starve+=dt;if(G.starve>4){G.blood=0;kill(G.player,'Se quedó sin sangre');G.starve=0}}else G.starve=0;

  /* colonia */
  G.fleas.forEach(f=>{if(f.alive&&f.ai&&f!==G.player)updateNpc(f,dt)});
  /* lupa */
  if(G.lens&&G.t>5&&G.player){
    const l=G.lens,pp=G.player,dx=pp.x-l.x,dy=pp.y-l.y,d=hyp(dx,dy),sp=26;
    if(d>1){l.x+=dx/d*sp*dt;l.y+=dy/d*sp*dt}
    if(d<20){l.prog+=dt/(pp.hidden?4:1.5);if(l.prog>=1){kill(pp,'Las pinzas de mamá la atraparon');l.prog=0;const a=rand(0,TAU);l.x=Math.cos(a)*85;l.y=Math.sin(a)*85}}
    else l.prog=Math.max(0,l.prog-dt*.6);
  }
  /* huevos */
  const anyAdult=adults()>0;
  G.eggs=G.eggs.filter(e=>{
    e.t+=dt*(anyAdult?1:3);
    if(e.t>=HATCH){
      const f=makeFlea(e.x,e.y,true);f.tx=e.x;f.ty=e.y;G.fleas.push(f);SFX.hatch();splat(e.x,e.y,'#f8e8d8',6);
      if(!G.player){G.player=f;f.ai=false;G.blood=Math.max(G.blood,45);toast('Nació tu nueva pulga',false,1.6)}
      return false;
    }
    return true;
  });
  G.fleas=G.fleas.filter(f=>f.alive);
  if(!G.player&&!G.eggs.length&&G.overT<=0&&!G.fleas.length){G.overT=.9}

  /* marcas */
  G.marks=G.marks.filter(k=>{k.age+=dt;if(!(G.player&&G.player.biting&&hyp(k.x-G.player.x,k.y-G.player.y)<8))k.h=Math.max(0,k.h-dt*.09);return k.age<45});

  /* comezón */
  G.itch=clamp(G.itch-1.1*dt,0,100);
  if(G.itch>=100){G.itch=58;G.queue=['shampoo','comb'];toast('¡Ya no aguanta y fue a la farmacia!',true,2.4);G.spawnT=.8}

  /* enemigos */
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.player){
    if(!majorActive()||L.boss&&G.queue.length===0){
      const k=G.queue.length?G.queue.shift():pickThreat();
      if(k==='nails'||!majorActive())spawn(k);
      G.spawnT=G.queue.length?1.2:L.every*(1-.5*G.itch/100)*rand(.85,1.15);
      if(k!=='nails'&&L.boss&&G.t>40)spawn('nails');
    }else G.spawnT=.5;
  }

  /* meta y contacto */
  if(L.boss){G.patience=Math.max(0,G.patience-dt);if(G.patience<=0)G.goalDone=true}
  else if(adults()>=L.goal)G.goalDone=true;
  if(G.goalDone&&!G.contact){
    G.contactWait-=dt;
    if(G.contactWait<=0){
      const ch=[Math.PI,0,-.75,-2.4,.6,2.5];
      G.contact={a:ch[Math.random()*ch.length|0],w:L.zone*(save.ups.salto?1.5:1),t:0,dur:L.window+(save.ups.salto?5:0),open:true,slide:0};
      toast(L.contact,false,2.8);SFX.warn();$('btnJump').hidden=false;
    }
  }
  if(G.contact){
    const c=G.contact;c.t+=dt;c.slide=clamp(c.t/.6,0,1);
    if(c.t>c.dur){G.contact=null;G.contactWait=8;$('btnJump').hidden=true;toast('Se alejó. Espera el siguiente contacto',true,2)}
  }

  tutorial();
  hud();
}
function tutorial(){
  if(G.tut<0)return;
  const hint=$('hint');let msg='';
  if(G.tut===0){msg='Arrastra el dedo en cualquier parte para moverte';if(G.moved>.8)G.tut=1}
  else if(G.tut===1){msg='Suelta y quédate quieta: así picas y llenas tu sangre';if(G.blood>=75)G.tut=2}
  else if(G.tut===2){msg='Toca Huevo. Cada huevo será una pulga nueva y una vida extra'}
  else if(G.tut===3){msg='Muévete mientras nace. Picar el mismo punto da más comezón';if(G.t>14&&G.player&&G.player.hidden)G.tut=4;else if(G.threats.length)G.tut=4}
  else if(G.tut===4){msg='En los mechones oscuros no te alcanzan las uñas';if(G.goalDone)G.tut=5}
  else{msg='';G.tut=-1}
  hint.hidden=!msg;hint.textContent=msg;
}
let lastHud={};
function setTxt(el,key,v){if(lastHud[key]!==v){lastHud[key]=v;el.textContent=v}}
function hud(){
  const L=G.L;
  $('barBlood').style.transform=`scaleX(${G.blood/100})`;
  $('barItch').style.transform=`scaleX(${G.itch/100})`;
  setTxt($('itchLabel'),'itch','Comezón: '+(G.itch<40?'tranquilo':G.itch<75?'se rasca':'va a la farmacia'));
  if(L.boss)$('barPat').style.transform=`scaleX(${G.patience/L.patience})`;
  const a=adults(),e=G.eggs.length;
  setTxt($('colTxt'),'col',(L.boss?'Colonia: '+a:'Colonia: '+a+' de '+L.goal)+(e?' · '+e+(e>1?' huevos':' huevo'):''));
  const p=G.player;
  setTxt($('hidChip'),'hid',p&&p.hidden?'Oculta':'');
  $('btnEgg').setAttribute('aria-disabled',G.blood<EGG_COST||!p?'true':'false');
  if(G.contact){
    const ok=inZone(p);const j=$('btnJump');
    j.setAttribute('aria-disabled',ok?'false':'true');j.classList.toggle('ready',ok);
    const left=Math.ceil(G.contact.dur-G.contact.t);
    setTxt(j.querySelector('small'),'jmp',ok?'¡Ahora!':'Ve a la zona · '+left+' s');
  }
}

/* ---------- Dibujo ---------- */
function drawFlea(f,isP){
  const c=ctx,sc=isP?1.2:.92;
  c.save();c.translate(f.x,f.y);
  let air=1;
  if(isP&&G.jump){air=1+Math.sin(G.jump.t*Math.PI)*2.2}
  c.rotate(f.a);c.scale(sc*air,sc*air);
  c.strokeStyle='#1d0a08';c.lineWidth=.55;c.lineCap='round';
  for(let i=0;i<3;i++){const sw=Math.sin(f.step+i*2)*.9,x=-2+i*2.4;
    [-1,1].forEach(s=>{c.beginPath();c.moveTo(x,s*1.6);c.lineTo(x+sw*s-.6,s*3.6);c.lineTo(x+sw*s-1.6+(i==0?-1:0),s*5.2);c.stroke()})}
  const full=isP?G.blood/100:.6;
  c.fillStyle=f.biting?'#a11230':lerpCol('#3b1a12','#7c1a24',full);
  c.beginPath();c.ellipse(-.8,0,4.4+full*.8,2.8+full*.8,0,0,TAU);c.fill();
  c.strokeStyle='rgba(255,220,190,.5)';c.lineWidth=.35;
  for(let i=-3;i<2;i+=1.6){c.beginPath();c.moveTo(i,-2.3);c.quadraticCurveTo(i+.7,0,i,2.3);c.stroke()}
  c.fillStyle='#24100b';c.beginPath();c.ellipse(3.6,0,1.7,1.5,0,0,TAU);c.fill();
  c.fillStyle='#fff3d6';c.beginPath();c.arc(4.1,-.75,.45,0,TAU);c.arc(4.1,.75,.45,0,TAU);c.fill();
  c.strokeStyle='#24100b';c.lineWidth=.35;[-1,1].forEach(s=>{c.beginPath();c.moveTo(4.7,s*.5);c.lineTo(6.2,s*1.6);c.stroke()});
  if(f.biting){c.strokeStyle='#e0213f';c.lineWidth=.6;c.beginPath();c.moveTo(4.8,0);c.lineTo(6.4,0);c.stroke()}
  if(f.shield){c.strokeStyle='#ffc933';c.lineWidth=.5;c.beginPath();c.ellipse(-.6,0,6,4.2,0,0,TAU);c.stroke()}
  c.restore();
}
function lerpCol(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const f=s=>Math.round(lerp(x>>s&255,y>>s&255,t));return `rgb(${f(16)},${f(8)},${f(0)})`}

  c.restore();
  c.strokeStyle='#ffc933';c.lineWidth=.6;c.beginPath();c.arc(e.x,e.y,4.2,-Math.PI/2,-Math.PI/2+pulse*TAU);c.stroke();

function clipHead(c){c.beginPath();c.arc(0,0,R,0,TAU);c.clip()}
function drawShampoo(th){

  /* marcas de picada */
  G.marks.forEach(k=>{const al=clamp(.25+k.h*.18,0,.8)*clamp(1-k.age/45,0,1)*1.2;c.fillStyle=`rgba(214,40,60,${al})`;c.beginPath();c.arc(k.x,k.y,2.2+k.h*.8,0,TAU);c.fill()});
  G.scratches.forEach(s=>{c.save();c.translate(s.x,s.y);c.rotate(s.a);c.globalAlpha=(1-s.t/2)*.5;c.strokeStyle='#c8354a';c.lineWidth=.8;const n=G.L.paw?3:4;for(let i=0;i<n;i++){const y=-s.w/2+s.w/n*(i+.5);c.beginPath();c.moveTo(-s.len/2,y);c.lineTo(s.len/2,y);c.stroke()}c.restore()});
  c.globalAlpha=1;
  drawZone();
  G.threats.forEach(t=>{if(t.k==='shampoo')drawShampoo(t)});
  G.eggs.forEach(drawEgg);
  G.fleas.forEach(f=>{if(f.alive&&f!==G.player)drawFlea(f,false)});
  if(G.player&&G.player.alive)drawFlea(G.player,true);
  c.save();c.setTransform(1,0,0,1,sx*DPR,sy*DPR);c.drawImage(layers.over,0,0);c.restore();
  /* la nube de laca */
  G.w.clouds.forEach(z=>{const g=c.createRadialGradient(z.x,z.y,2,z.x,z.y,z.r);g.addColorStop(0,'rgba(255,190,225,.72)');g.addColorStop(.8,'rgba(255,190,225,.42)');g.addColorStop(1,'rgba(255,190,225,0)');c.fillStyle=g;c.beginPath();c.arc(z.x,z.y,z.r,0,TAU);c.fill()});
  /* jugadora siempre localizable */
  const p=G.player;
  if(p&&p.alive&&!G.attract&&!G.jump){
    c.strokeStyle='#ffc933';c.lineWidth=1.1;
    if(p.hidden)c.setLineDash([2.5,2.5]);
    c.beginPath();c.arc(p.x,p.y,8.2+(p.biting?Math.sin(G.t*14)*.8:0),0,TAU);c.stroke();c.setLineDash([]);
    if(p.hidden){c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle='#fff3d6';c.beginPath();c.arc(4.7,-.9,.6,0,TAU);c.arc(4.7,.9,.6,0,TAU);c.fill();c.restore()}
  }
  G.threats.forEach(t=>{if(t.k==='nails')drawNails(t);else if(t.k==='comb')drawComb(t);else if(t.k==='dryer')drawDryer(t)});
  if(G.lens)drawLens();
  G.parts.forEach(q=>{c.globalAlpha=1-q.t/q.life;c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.fill()});
  c.globalAlpha=1;
  /* palanca */
  if(joy&&mode==='play'){
    c.setTransform(DPR,0,0,DPR,0,0);
    c.strokeStyle='rgba(248,232,216,.5)';c.lineWidth=2;c.beginPath();c.arc(joy.sx,joy.sy,30,0,TAU);c.stroke();
    const dx=joy.x-joy.sx,dy=joy.y-joy.sy,m=hyp(dx,dy),k=m>30?30/m:1;
    c.fillStyle='rgba(248,232,216,.45)';c.beginPath();c.arc(joy.sx+dx*k,joy.sy+dy*k,12,0,TAU);c.fill();
  }
}
let lastT=0;
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  if(G&&(mode==='play'||mode==='title')){update(dt)}
  if(G&&mode!=='map')render();
  requestAnimationFrame(frame);
}

/* ---------- Pantallas ---------- */
const SCREENS=['sTitle','sMap'];
function showOnly(id){
  SCREENS.forEach(s=>{$(s).hidden=s!==id});
  $('sheet').hidden=true;
  if(id){$('hud').hidden=true;$('btnEgg').hidden=true;$('btnJump').hidden=true;$('hint').hidden=true;$('toast').classList.remove('show')}
}
function sheet(html){$('sheetBody').innerHTML=html;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
function pause(){
  if(mode!=='play'||G.jump||G.overT>0)return;
  mode='paused';
  sheet(`<div class="eyebrow">${G.L.place}</div><h2>Pausa</h2><p>Arrastra para moverte y suelta para picar. Con teclado: flechas, E para huevo, espacio para saltar.</p>
  <div class="actions"><button class="btn" id="bRes">Seguir</button><button class="btn alt" id="bRetry">Reintentar esta cabeza</button><button class="btn alt" id="bMap">Volver al mapa</button></div>`);
  $('bRes').onclick=()=>{closeSheet();mode='play';lastT=performance.now()};
  $('bRetry').onclick=()=>{closeSheet();startLevel(G.L)};
  $('bMap').onclick=showMap;
}
function gameOver(){
  mode='over';const L=G.L;
  sheet(`<div class="eyebrow">Colonia eliminada</div><h2>${L.who} quedó sin pulgas</h2><p>Tus zonas conquistadas siguen en el mapa. Te faltó poco: intenta esconder los huevos en un mechón.</p>
  <div class="stats"><div><b>${Math.round(G.t)} s</b><span>Aguantaste</span></div><div><b>${G.lost}</b><span>Pulgas perdidas</span></div><div><b>${Math.round(G.gotas/2)}</b><span>Gotas salvadas</span></div></div>
  <div class="actions"><button class="btn" id="bRetry">Reintentar</button><button class="btn alt" id="bMap">Volver al mapa</button></div>`);
  save.gotas+=Math.round(G.gotas/2);writeSave();
  $('bRetry').onclick=()=>{closeSheet();startLevel(L)};
  $('bMap').onclick=showMap;
}
function finishLevel(){
  mode='done';const L=G.L,first=!save.done[L.id];
  const earned=Math.round(G.gotas)+(first?L.reward:Math.round(L.reward/2));
  save.gotas+=earned;save.done[L.id]=true;
  const perfect=G.lost===0;let foundDog=false;
  if(perfect&&!save.dog&&L.id!=='perro'){save.dog=true;foundDog=true}
  writeSave();SFX.win();
  if(L.id==='mama'){showWin(earned);return}
  sheet(`<div class="eyebrow">Caso nuevo en ${L.place}</div><h2>${L.who}: infectado</h2>
  <div class="stats"><div><b>+${earned}</b><span>Gotas</span></div><div><b>${adults()}</b><span>Pulgas vivas</span></div><div><b>${G.lost}</b><span>Perdidas</span></div></div>
  ${foundDog?'<p class="goal">No perdiste ninguna pulga y descubriste un sitio secreto en el mapa: el Parque.</p>':''}
  <div class="actions"><button class="btn" id="bMap">Ver el mapa</button></div>`);
  $('bMap').onclick=showMap;
}
function showWin(earned){
  const n=LEVELS.filter(l=>save.done[l.id]).length;
  sheet(`<div class="eyebrow">Último boletín</div><h2>La ciudad es de la plaga</h2>
  <p>Mamá se rindió y su abrazo te llevó a la última cabeza. Infectaste ${n} de ${LEVELS.length}.${save.done.perro?'':' Solo te faltó el perro.'}</p>
  <div class="stats"><div><b>+${earned}</b><span>Gotas</span></div><div><b>${G.lost}</b><span>Perdidas aquí</span></div><div><b>${n}/${LEVELS.length}</b><span>Infectados</span></div></div>
  <div class="actions"><button class="btn" id="bMap">Ver la ciudad infestada</button></div>`);
  $('bMap').onclick=showMap;
}

/* ---------- Mapa ---------- */
const POS={nino:[66,352],teen:[166,274],calvo:[268,206],abuela:[104,142],mama:[250,58],perro:[272,344]};
function isOpen(L){
  if(L.secret)return save.dog;
  const i=ORDER.indexOf(L.id);return i===0||save.done[ORDER[i-1]];
}
function showMap(){
  mode='map';closeSheet();showOnly('sMap');$('hud').hidden=true;
  G=null;
  const done=LEVELS.filter(l=>save.done[l.id]).length;
  $('tInf').textContent=done+'/'+LEVELS.length;$('tGot').textContent=save.gotas;
  $('btnMute').textContent='Sonido: '+(save.mute?'no':'sí');
  /* calles */
  let s=`<svg viewBox="0 0 340 410" role="group" aria-label="Mapa de la ciudad con los lugares a infectar">`;
  s+=`<g stroke="rgba(248,232,216,.1)" stroke-width="9" stroke-linecap="round" fill="none"><path d="M-10 90 L350 30"/><path d="M-10 210 L350 140"/><path d="M-10 330 L350 268"/><path d="M-10 410 L350 362"/><path d="M50 -10 L100 420"/><path d="M180 -10 L225 420"/><path d="M300 -10 L340 420"/></g>`;
  const rt=ORDER.map(id=>POS[id]);
  s+=`<polyline points="${rt.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e0213f" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>`;
  LEVELS.forEach(L=>{
    const [x,y]=POS[L.id],d=save.done[L.id],o=isOpen(L);
    if(L.secret&&!o){
      s+=`<g class="node locked" transform="translate(${x},${y})" aria-label="Lugar secreto"><circle r="17" fill="none" stroke="#c9a999" stroke-width="2" stroke-dasharray="3 5"/><text y="6" class="pl" style="font-size:17px">?</text><text y="34" class="wh">No pierdas ni una pulga</text></g>`;
      return;
    }
    const cls=d?'done':o?'open':'locked';
    s+=`<g class="node ${cls}" data-id="${L.id}" transform="translate(${x},${y})" ${o?'tabindex="0" role="button"':''} aria-label="${L.place}, ${L.who}${d?', infectado':o?', disponible':', bloqueado'}">`;
    s+=`<circle r="30" fill="transparent"/>`;
    if(d){
      s+=`<g fill="#e0213f"><circle r="17"/><circle cx="-17" cy="-5" r="5"/><circle cx="15" cy="11" r="6.5"/><circle cx="8" cy="-18" r="4"/><circle cx="-11" cy="15" r="3.4"/></g>`;
      s+=`<g fill="none" stroke="#1d0a08" stroke-width="1.5" stroke-linecap="round"><path d="M-7 -5 L-11 -9M-7 0 L-12 0M-7 5 L-11 9M7 -5 L11 -9M7 0 L12 0M7 5 L11 9"/></g><ellipse rx="7.5" ry="5.2" fill="#1d0a08"/>`;
    }else if(o){
      s+=`<circle class="ping" r="15" fill="none" stroke="#ffc933" stroke-width="3"/><circle r="13" fill="#ffc933"/><circle r="5" fill="#160709"/>`;
    }else{
      s+=`<circle r="12" fill="#2a0e14" stroke="#c9a999" stroke-width="2"/>`;
    }
    s+=`<text y="${d?38:32}" class="pl">${L.place}</text><text y="${d?52:46}" class="wh">${L.who}</text></g>`;
  });
  s+=`</svg>`;
  $('mapBox').innerHTML=s;
  $('mapBox').querySelectorAll('.node[data-id]').forEach(n=>{
    const go=()=>{const L=LV(n.dataset.id);if(isOpen(L))levelSheet(L)};
    n.addEventListener('click',go);
    n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
  /* mejoras */
  $('upList').innerHTML=UPS.map(u=>{
    const own=save.ups[u.id],can=save.gotas>=u.cost;
    return `<div class="up"><b>${u.name}</b><p>${u.txt}</p><button data-u="${u.id}" ${own||!can?'disabled':''}>${own?'Activa':u.cost+' gotas'}</button></div>`;
  }).join('');
  $('upList').querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>{
    const u=UPS.find(x=>x.id===b.dataset.u);
    if(save.gotas>=u.cost&&!save.ups[u.id]){save.gotas-=u.cost;save.ups[u.id]=true;writeSave();const y=$('sMap').scrollTop;showMap();$('sMap').scrollTop=y}
  });
}
function levelSheet(L){
  const again=save.done[L.id];
  sheet(`<div class="eyebrow">${L.place}${again?' · ya infectado':''}</div><h2>${L.who}</h2><p>${L.blurb}</p>
  <p class="goal">${L.boss?'Meta: aguanta 85 segundos y salta al abrazo.':'Meta: junta '+L.goal+' pulgas adultas y salta a otra cabeza.'}</p>
  <div class="chips">${L.watch.map(w=>`<span>${w}</span>`).join('')}</div>
  <div class="actions"><button class="btn" id="bGo">${again?'Volver a infectar':'Entrar a la cabeza'}</button><button class="btn alt" id="bBack">Volver</button></div>`);
  $('bGo').onclick=()=>{closeSheet();startLevel(L)};
  $('bBack').onclick=closeSheet;
}

/* ---------- Inicio ---------- */
let resetArmed=false;
function refreshTitle(){
  const p=hasProgress();
  $('btnStart').textContent=p?'Seguir la plaga':'Empezar la plaga';
  $('btnReset').hidden=!p;$('btnReset').textContent='Borrar avance';resetArmed=false;
  const n=LEVELS.filter(l=>save.done[l.id]).length;
  $('titleNote').textContent=p?`Llevas ${n} de ${LEVELS.length} infectados`:'';
}
$('btnStart').onclick=()=>{audioOn();showMap()};
$('btnReset').onclick=()=>{
  if(!resetArmed){resetArmed=true;$('btnReset').textContent='Toca otra vez para borrar todo';return}
  save={done:{},gotas:0,ups:{},dog:false,mute:save.mute};writeSave();refreshTitle();
};
$('btnBackTitle').onclick=()=>{startAttract();refreshTitle()};
$('btnMute').onclick=()=>{save.mute=!save.mute;writeSave();$('btnMute').textContent='Sonido: '+(save.mute?'no':'sí');if(!save.mute)audioOn()};

refreshTitle();
startAttract();
requestAnimationFrame(frame);
</script>
</body>
